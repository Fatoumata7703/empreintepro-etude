name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping étude EmpreintePro
        run: |
          curl -fsS --max-time 30 "https://empreintepro-etude.onrender.com/ping" || true
          curl -fsS --max-time 45 "https://empreintepro-etude.onrender.com/" -o /dev/null || true
