databases:
  - name: empreintepro-etude-db
    plan: free

services:
  - type: web
    name: empreintepro-etude
    runtime: python
    rootDir: docs
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_DEBUG
        value: "0"
      - key: ETUDE_ADMIN
        generateValue: true
      - key: ETUDE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: empreintepro-etude-db
          property: connectionString
