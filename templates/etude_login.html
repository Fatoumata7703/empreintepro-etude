<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — EmpreintePro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="{{ url_for('static', filename='img/logo-mark.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/etude.css') }}" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <img src="{{ url_for('static', filename='img/logo-mark.png') }}" alt="">
        <span>EmpreintePro</span>
      </div>
      <p class="kicker" style="margin-top:1.2rem;">Espace interne</p>
      <h1>Tableau de bord</h1>
      <p class="lead" style="margin-bottom:1.1rem;">Résultats de l’étude de marché. Pas pour les répondants.</p>
      {% if error %}<p class="warn">{{ error }}</p>{% endif %}
      <form method="post">
        <label class="label" for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Entrer</button>
      </form>
    </div>
  </div>
</body>
</html>
